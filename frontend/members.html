<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Thành viên - HỆ THỐNG QUẢN LÝ THƯ VIỆN</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar Navigation -->
      <nav class="col-md-3 col-lg-2 d-md-block sidebar text-white p-3">
        <div class="d-flex align-items-center mb-4">
          <h4 class="fw-bold text-primary mb-0">📚 Thư Viện Admin</h4>
        </div>
        <hr class="bg-secondary">
        <ul class="nav flex-column mb-auto">
          <li class="nav-item mb-1">
            <a href="books.html" class="nav-link">
              📖 Quản lý Sách
            </a>
          </li>
          <li class="nav-item mb-1">
            <a href="members.html" class="nav-link active">
              👥 Quản lý Thành viên
            </a>
          </li>
          <li class="nav-item mb-1">
            <a href="borrow.html" class="nav-link">
              🔄 Mượn / Trả Sách
            </a>
          </li>
          <li class="nav-item mb-1">
            <a href="stats.html" class="nav-link">
              📊 Thống kê Dashboard
            </a>
          </li>
        </ul>
        <hr class="bg-secondary mt-4">
        <div class="dropdown">
          <span id="currentUserDisplay" class="d-block small text-light mb-2">Đang tải...</span>
          <button onclick="logout()" class="btn btn-outline-danger btn-sm w-100">
            🚪 Đăng xuất
          </button>
        </div>
      </nav>

      <!-- Main Content Area -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
        
        <!-- Header Page -->
        <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
          <div>
            <h2 class="h3 fw-bold text-dark mb-1">👥 Quản Lý Thành Viên</h2>
            <p class="text-muted mb-0">Quản lý thông tin tài khoản độc giả và danh sách thành viên thư viện</p>
          </div>
          <button class="btn btn-primary fw-bold" onclick="openAddMemberModal()">
            ➕ Thêm Thành Viên Mới
          </button>
        </div>

        <!-- Search Bar -->
        <div class="card mb-4 border-0 shadow-sm">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-9">
                <input type="text" id="searchInput" class="form-control" placeholder="🔍 Nhập họ tên, email, số điện thoại hoặc địa chỉ thành viên...">
              </div>
              <div class="col-md-3">
                <button id="btnSearch" class="btn btn-secondary w-100 fw-bold">
                  Tìm kiếm
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Members Table -->
        <div class="card border-0 shadow-sm">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col">Họ và Tên</th>
                    <th scope="col">Email</th>
                    <th scope="col">Số Điện Thoại</th>
                    <th scope="col">Địa Chỉ</th>
                    <th scope="col">Ngày Tham Gia</th>
                    <th scope="col">Hành Động</th>
                  </tr>
                </thead>
                <tbody id="membersTableBody">
                  <!-- Dữ liệu sẽ được load qua Javascript (js/members.js) -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Modal Thêm / Sửa Thành Viên -->
  <div class="modal fade" id="memberModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold" id="memberModalTitle">Thêm Thành Viên Mới</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="memberForm">
          <div class="modal-body">
            <div class="mb-3">
              <label for="memberName" class="form-label fw-bold">Họ và Tên <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="memberName" required placeholder="Ví dụ: Trần Thị B">
            </div>
            <div class="mb-3">
              <label for="memberEmail" class="form-label fw-bold">Email</label>
              <input type="email" class="form-control" id="memberEmail" placeholder="Ví dụ: tranthib@gmail.com">
            </div>
            <div class="mb-3">
              <label for="memberPhone" class="form-label fw-bold">Số Điện Thoại</label>
              <input type="tel" class="form-control" id="memberPhone" placeholder="Ví dụ: 0987654321">
            </div>
            <div class="mb-3">
              <label for="memberAddress" class="form-label fw-bold">Địa Chỉ</label>
              <input type="text" class="form-control" id="memberAddress" placeholder="Ví dụ: 123 Đường Cầu Giấy, Hà Nội">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button type="submit" class="btn btn-primary fw-bold">Lưu Thông Tin</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/members.js"></script>
</body>
</html>
